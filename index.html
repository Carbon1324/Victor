<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bild anzeigen</title>
  <style>
    /* Einfaches responsives Styling */
    .container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
      text-align: center;
    }
    img.responsive {
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Mein Bild</h1>

    <!-- Einfaches Bild (verweist auf vorhandene Datei im Repo-Root) -->
    <img class="responsive" src="Screenshot_2025-11-20-14-08-58-39_6012fa4d4ddec268fc5c7112cbb265e7.jpg" alt="Beschreibung des Bildes" loading="lazy">

    <!-- Alternativ: <picture> für unterschiedliche Auflösungen / Formate -->
    <picture>
      <source srcset="Screenshot_2025-11-20-14-08-58-39_6012fa4d4ddec268fc5c7112cbb265e7.jpg" type="image/jpeg">
      <img class="responsive" src="Screenshot_2025-11-20-14-08-58-39_6012fa4d4ddec268fc5c7112cbb265e7.jpg" alt="Beschreibung des Bildes" loading="lazy">
    </picture>
  </main>
</body>
</html>
